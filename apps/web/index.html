<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <script>
      (() => {
        const stored = localStorage.getItem('creator-os-appearance');
        const mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        const resolved = mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'system' ? 'light' : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.classList.toggle('dark', resolved === 'dark');
      })();
    </script>

    <!-- Primary Meta -->
    <title>Creator OS — The AI Operating System for Creators</title>
    <meta name="description" content="Creator OS is the all-in-one AI-powered operating system for modern content creators. Generate viral ideas, hooks, captions, and manage campaigns — all in one place." />
    <meta name="keywords" content="creator OS, AI content creation, TikTok content, viral hooks, content calendar, creator tools" />
    <meta name="author" content="Creator OS" />
    <link rel="canonical" href="https://creator-os999.vercel.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://creator-os999.vercel.app" />
    <meta property="og:title" content="Creator OS — The AI Operating System for Creators" />
    <meta property="og:description" content="Stop guessing what to post. Creator OS uses AI to generate viral ideas, hooks, and captions tailored to your niche — so you can focus on creating." />
    <meta property="og:image" content="https://creator-os999.vercel.app/brand/creator-os-lockup.png" />
    <meta property="og:site_name" content="Creator OS" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://creator-os999.vercel.app/brand/creator-os-lockup.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#7C3AED" />
    <meta name="color-scheme" content="light dark" />

    <!-- Fonts -->
