    <script>
      (() => {
        const stored = localStorage.getItem('creator-os-appearance');
        const mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        const resolved = mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'system' ? 'light' : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.classList.toggle('dark', resolved === 'dark');
      })();
    </script>
